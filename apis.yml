aid: sadq-holding-limited
name: Sadq Holding Limited
description: >-
  Sadq (صادق) is a Saudi Arabian electronic-signature and digital-trust platform
  that lets businesses send, sign, and manage legally binding documents online.
  Its Integration API covers signing envelopes and document packages, signing
  invitations (email/SMS/link), direct and template-based signing, PKI/e-signing
  via Saudi Arabia's Nafath national digital identity, document download,
  reusable templates, users and permissions, signing workflows, webhooks, KYB
  business verification (commercial-registration checks, Absher OTP, delegacy and
  national-address lookups), archiving, delegations, and consumption reporting.
  The platform is fully agent-native — it publishes an OpenAPI schema, an
  RFC 9727 API catalog, OAuth 2.0 / OIDC discovery metadata, an llms.txt, an
  auth.md agent-registration guide, and a hosted MCP server. Sadq is a 500 Global
  portfolio company.
