openapi: 3.0.0
info:
  title: Sadq Integration Archiving & Delegations Templates API
  description: API reference for the Sadq e-signature platform
  version: 1.0.0
  contact:
    url: https://docs.sadq.sa
servers:
- url: https://api.sadq.sa
  description: Production
- url: https://sandbox-api.sadq-sa.com
  description: Sandbox
tags:
- name: Templates
  description: List and retrieve reusable signing templates
  x-docs-url: https://docs.sadq.sa/docs/templates
paths:
  /api/v1/templates:
    get:
      tags:
      - Templates
      summary: List Templates
      description: Retrieve a paginated list of all reusable document signing templates available to the authenticated account.
      deprecated: false
      x-docs-url: https://docs.sadq.sa/docs/templates/get-api-v1-templates
      security:
      - BearerAuth: []
      parameters: []
      responses:
        '200':
          description: Templates list returned
          content:
            application/json:
              example:
                data:
                - id: 94b22fdc-4132-4169-a4f3-5630e80755fa
                  fileName: sample6.pdf
                  uploadDate: '2025-11-23T12:35:39.58'
                  shareType: 3
                - id: b34f152e-29a7-4195-8339-ba0cb0c97cf4
                  fileName: New_Template.pdf
                  uploadDate: '2025-12-14T11:31:58.117'
                  shareType: 2
                errorCode: 0
                message: Success
                returnUrl: ''
                stateValidationErrors: null
                signature: ''
  /api/v1/templates/{templateId}:
    get:
      tags:
      - Templates
      summary: Get Template by ID
      description: Retrieves detailed information about a specific template, including its destinations (signers) and creator fields.
      deprecated: false
      x-docs-url: https://docs.sadq.sa/docs/templates/get-api-v1-templates-templateid
      security:
      - BearerAuth: []
      parameters:
      - name: templateId
        in: path
        required: true
        description: The unique template ID
        schema:
          type: string
      responses:
        '200':
          description: Template details
          content:
            application/json:
              example:
                data:
                  templateId: 94b22fdc-4132-4169-a4f3-5630e80755fa
                  fileName: sample6.pdf
                  destinations:
                  - destinationName: null
                    destinationEmail: null
                    destinationPhoneNumber: ''
                    signeOrder: 0
                    signatories:
                    - positionX: 7.5836406
                      positionY: 7.650696
                      signatureHigh: 36.72334
                      signatureWidth: 303.99942
                      pageNumber: 1
                      text: ''
                      type: Signature
                      fieldLabel: null
                      fontFamily: D3F13AA8-A350-4739-B862-27070B4943C0
                      fontSize: 12
                      appendDate: false
                      documentId: null
                      isRequired: true
                      textAlignment: 0
                      dataSource: null
                    - positionX: 334.21112
                      positionY: 174.05334
                      signatureHigh: 75.588875
                      signatureWidth: 186.40596
                      pageNumber: 1
                      text: ''
                      type: Signature
                      fieldLabel: null
                      fontFamily: D3F13AA8-A350-4739-B862-27070B4943C0
                      fontSize: 12
                      appendDate: false
                      documentId: null
                      isRequired: true
                      textAlignment: 0
                      dataSource: null
                    - positionX: 71.049286
                      positionY: 178.08905
                      signatureHigh: 67.1731
                      signatureWidth: 198.53976
                      pageNumber: 1
                      text: null
                      type: CreatorSignature
                      fieldLabel: null
                      fontFamily: D3F13AA8-A350-4739-B862-27070B4943C0
                      fontSize: 12
                      appendDate: false
                      documentId: null
                      isRequired: true
                      textAlignment: 0
                      dataSource: null
                    availableTo: '2026-06-17T00:00:00+03:00'
                    consentOnly: false
                    authenticationType: 0
                    allowUserToSignAnyWhere: false
                    destinationType: 1
                    nationalId: null
                    invitationLanguage: null
                    redirectUrl: null
                    allowUserToAddDestination: false
                    delegaterId: null
                    commercialNumber: null
                    uploadFile: null
                    dailyNotify: false
                    escalation: null
                  creatorFields: {}
                errorCode: 0
                message: Success
                returnUrl: /dashboard
                stateValidationErrors: null
                signature: ''
        '404':
          description: Template not found
          content:
            application/json:
              example:
                data: null
                errorCode: 0
                message: Success
                returnUrl: /dashboard
                stateValidationErrors: null
                signature: ''
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
