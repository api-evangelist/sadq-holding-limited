- id: enum-1779092035465
  name: Authentication Type
  description: Authentication methods available for signature requests and user verification.
  entries:
  - value: '0'
    name: None
    description: No authentication is required.
  - value: '1'
    name: Nafath KYC
    description: Users authenticate through Nafath for the first time then will be login with Sadq credentials
  - value: '2'
    name: SMS
    description: An OTP is sent via SMS to verify the user's identity.
  - value: '3'
    name: Email
    description: An OTP is sent via email for authentication.
  - value: '5'
    name: DigitalSign
    description: For Digital signature authentication for documents Only
  - value: '7'
    name: Nafath App
    description: Authentication through the Nafath mobile application every time
  - value: '9'
    name: Absher OTP
    description: Users authenticate using an OTP from the Absher platform.
  - value: '10'
    name: WhatsApp
    description: An authentication OTP is sent to WhatsApp.
